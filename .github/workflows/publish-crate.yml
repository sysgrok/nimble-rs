name: PublishCrate

on:
  workflow_dispatch:
    inputs:
      crate:
        required: true
        type: choice
        description: Crate to publish
        options:
        - nimble-rs-sys
        - nimble-rs

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # `contents: write` is required so the "Tag the new release" step can push the
    # git tag. The default GITHUB_TOKEN is read-only for repos/orgs whose default
    # workflow permissions are "read".
    permissions:
      contents: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4
        with:
          # The `-sys` crate vendors its C sources from the esp-nimble git
          # submodule; it must be checked out so the packaged files exist.
          submodules: true
      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Login
        run: cargo login ${{ secrets.crates_io_token }}
      - name: Build | Publish
        # Default features suffice: both crates build for the host (the sys
        # crate cross-compiles its C only when the *Rust* target is foreign),
        # and `cargo publish` verifies an rlib, so no linking is involved.
        # Publish order matters: nimble-rs verifies against the nimble-rs-sys
        # release on crates.io, so the sys crate must go first.
        run: |
          cd "${{ github.event.inputs.crate }}"
          cargo publish
      - name: Get the crate version from cargo
        run: |
          version=$(cargo metadata --format-version=1 --no-deps | jq -r ".packages[] | select(.name == \"${{github.event.inputs.crate}}\") | .version")
          echo "crate_version=$version" >> $GITHUB_ENV
          echo "${{github.event.inputs.crate}} version: $version"
      - name: Tag the new release
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{github.event.inputs.crate}}-v${{env.crate_version}}
          message: "Release ${{github.event.inputs.crate}} v${{env.crate_version}}"
