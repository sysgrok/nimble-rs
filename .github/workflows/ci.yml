name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  # Code hygiene: formatting (rustfmt) and lints (clippy) across the
  # workspace. A failure means style/lint drift, never a functional problem.
  lint:
    name: Format + lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      # The crates outside the workspace (tooling; the embedded examples,
      # each its own workspace). rustfmt needs no dependency resolution, so
      # this is cheap even for the cross-compiled ones.
      - name: rustfmt (excluded crates)
        run: |
          cargo fmt --check --manifest-path xtask/Cargo.toml
          cargo fmt --check --manifest-path examples/nrf/Cargo.toml
          cargo fmt --check --manifest-path examples/rp/Cargo.toml
          cargo fmt --check --manifest-path examples/esp/Cargo.toml
      # --all-targets also lints the integration tests and example binaries
      - name: clippy (workspace)
        run: cargo clippy --workspace --exclude nimble-rs-upstream-tests --all-targets --features nimble-rs/std,nimble-rs/l2cap -- -D warnings
      # Separate invocation: the harness's test-only features must never
      # feature-unify with the other members (see the root manifest)
      - name: clippy (upstream test harness)
        run: cargo clippy -p nimble-rs-upstream-tests -- -D warnings
      - name: clippy (xtask)
        run: cargo clippy --manifest-path xtask/Cargo.toml -- -D warnings

  # The main functional gate on Linux: build everything, run the hermetic
  # integration tests (nimble-rs/tests: full host over an in-process mock
  # controller - no hardware, no privileges), build a matrix of feature
  # combinations of the sys crate, and verify the no_std/no-heap core keeps
  # compiling.
  test:
    name: Build + tests + feature matrix (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --workspace --exclude nimble-rs-upstream-tests
      - name: Hermetic integration tests
        run: cargo test -p nimble-rs --features std,l2cap
      - name: Feature matrix (nimble-rs-sys)
        run: |
          cargo build -p nimble-rs-sys --no-default-features --features peripheral
          cargo build -p nimble-rs-sys --no-default-features --features central
          cargo build -p nimble-rs-sys --no-default-features --features broadcaster
          cargo build -p nimble-rs-sys --features ext-adv,l2cap-coc-8,max-connections-16,sm-sc-only
      - name: no-std / no-alloc core check (nimble-rs)
        run: |
          cargo check -p nimble-rs --no-default-features --features peripheral,central,sm
          cargo check -p nimble-rs --no-default-features --features peripheral,central,sm,l2cap

  # 32-bit behavioral canary: upstream NimBLE forces -m32 for its own Linux
  # sim, citing 4-byte-pointer assumptions in the C code; this leg runs the
  # hermetic tests on a 32-bit target so both pointer widths stay honest
  # (the 64-bit fixes live in gen/glue). A failure usually means a new
  # pointer-width assumption crept in.
  i686:
    name: 32-bit canary (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Run the hermetic integration tests on i686
        run: cargo test --target i686-unknown-linux-gnu -p nimble-rs --features std,l2cap

  # Compile-checks the whole no_std stack for a real embedded target
  # (Cortex-M4). The clang leg needs no vendor toolchain at all - the C host
  # builds against the bundled fake sysroot (gen/sysroot) - and the use-gcc
  # leg exercises the arm-none-eabi-gcc path instead. Also the only compile
  # coverage for the WFE parker. A failure means something no_std- or
  # cross-compile-unfriendly was introduced.
  baremetal:
    name: Bare-metal cross-check (thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - name: clang + fake sysroot (no ARM toolchain)
        run: cargo check -p nimble-rs --no-default-features --features peripheral,central,sm --target thumbv7em-none-eabi
      - name: arm-none-eabi-gcc (use-gcc feature)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
          cargo check -p nimble-rs --no-default-features --features peripheral,central,sm,use-gcc --target thumbv7em-none-eabi

  # Portability check for the second hosted platform: the same build +
  # hermetic tests as the Linux job (the Linux-only example binaries
  # compile to stubs here).
  # Cross-builds the three embedded example crates (each its own workspace
  # with its own patch pins): nrf52840 and the nRF54L family over nrf-sdc,
  # ESP32-C6 over esp-radio, and Pico W over cyw43. A failure means an API or
  # dependency drift broke one of the real embedded targets.
  examples-embedded:
    name: Embedded examples (nrf, esp, rp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi, thumbv8m.main-none-eabihf, thumbv6m-none-eabi, riscv32imac-unknown-none-elf
      - name: nrf52840 (nrf-sdc)
        run: |
          cargo clippy --release -- -D warnings
          cargo build --release
        working-directory: examples/nrf
      # The nRF54L family: a different core (Cortex-M33), so a different
      # target, and the chip features are mutually exclusive - hence
      # `--no-default-features`. All but the nRF54L15 differ in the memory map
      # alone, so a `check` is enough there to catch a mis-wired feature; the
      # nRF54L15 is built in full, and built last, so that its binaries are
      # the ones the size report below picks up.
      - name: nrf54l (nrf-sdc)
        run: |
          for chip in nrf54l05 nrf54l10 nrf54lm20; do
            cargo check --release --no-default-features --features $chip --target thumbv8m.main-none-eabihf
          done
          cargo clippy --release --no-default-features --features nrf54l15 --target thumbv8m.main-none-eabihf -- -D warnings
          cargo build --release --no-default-features --features nrf54l15 --target thumbv8m.main-none-eabihf
        working-directory: examples/nrf
      - name: Pico W (cyw43)
        run: |
          cargo clippy --release -- -D warnings
          cargo build --release
        working-directory: examples/rp
      - name: ESP32-C6 (esp-radio)
        run: |
          cargo clippy --release -- -D warnings
          cargo build --release
        working-directory: examples/esp
      # Flash/RAM size tracking (the CHIP memdf toolkit under
      # .github/scripts/memory): one report per example binary, uploaded as
      # an artifact; the Bloat Check workflow (bloat-check.yaml) compares
      # them across commits/PRs and comments on regressions.
      - name: Set up environment for size reports
        uses: ./.github/actions/setup-size-reports
        if: ${{ !env.ACT }}
        with:
          gh-context: ${{ toJson(github) }}
      - name: Prepare bloat report from the previous builds
        run: |
          for bin in gatt_server gatt_client scanner; do
            python .github/scripts/memory/gh_sizes.py \
              nrf52_$bin defmtlogs-optz-ltofat thumbv7em-none-eabi \
              examples/nrf/target/thumbv7em-none-eabi/release/$bin \
              /tmp/bloat_reports/
            python .github/scripts/memory/gh_sizes.py \
              nrf54l_$bin defmtlogs-optz-ltofat thumbv8m.main-none-eabihf \
              examples/nrf/target/thumbv8m.main-none-eabihf/release/$bin \
              /tmp/bloat_reports/
            python .github/scripts/memory/gh_sizes.py \
              rp_$bin defmtlogs-optz-ltofat thumbv6m-none-eabi \
              examples/rp/target/thumbv6m-none-eabi/release/$bin \
              /tmp/bloat_reports/
            python .github/scripts/memory/gh_sizes.py \
              esp_$bin infologs-opts-ltofat riscv32imac-unknown-none-elf \
              examples/esp/target/riscv32imac-unknown-none-elf/release/$bin \
              /tmp/bloat_reports/
          done
      - name: Uploading Size Reports
        uses: ./.github/actions/upload-size-reports
        if: ${{ !env.ACT }}
        with:
          platform-name: cross-platform

  macos:
    name: macOS build + tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + run the hermetic integration tests
        run: |
          cargo build --workspace --exclude nimble-rs-upstream-tests
          cargo test -p nimble-rs --features std,l2cap

  # AddressSanitizer: runs the hermetic tests with compiler-inserted memory
  # checking in BOTH the C host and the Rust code (heap/stack buffer
  # overflows, use-after-free, double free...). This is the memory-safety
  # net for the C/FFI boundary - e.g. it is what would catch a regression of
  # the 64-bit pointer-truncation bugs fixed in gen/glue. A failure here is
  # a real memory bug even if the normal test job is green.
  asan:
    name: Memory checking (AddressSanitizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Run the hermetic integration tests under ASAN
        env:
          RUSTFLAGS: -Zsanitizer=address
          CFLAGS: -fsanitize=address
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p nimble-rs --features std,l2cap

  # The end-to-end tier: the real example binaries paired up over two BlueZ
  # btvirt *virtual Bluetooth controllers* (gatt_server <-> gatt_client,
  # l2cap server <-> client) - actual HCI traffic through the kernel, no
  # mocks. Kernel/module availability varies across runner images, so the
  # tier auto-skips when the prerequisites are missing and failures do not
  # (yet) fail the build.
  e2e-btvirt:
    name: End-to-end over virtual controllers (btvirt)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      # Every step tolerates failure: GitHub's Azure kernels may not ship the
      # hci_vhci module at all (linux-modules-extra is attempted, but not
      # guaranteed to contain the Bluetooth modules) - `cargo xtask e2e`
      # probes the prerequisites itself and skips with an explanation.
      - name: Set up btvirt
        run: |
          sudo apt-get update
          sudo apt-get install -y bluez bluez-test-tools libcap2-bin
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe hci_vhci || echo "hci_vhci unavailable - the btvirt tier will be skipped"
          sudo systemctl stop bluetooth || true
          sudo btvirt -l2 || true &
          sleep 2
      - name: Build and grant CAP_NET_ADMIN
        run: |
          cargo build -p nimble-rs-examples-std
          sudo setcap cap_net_admin+ep target/debug/gatt_server \
               cap_net_admin+ep target/debug/gatt_client \
               cap_net_admin+ep target/debug/gatt_server_dynamic \
               cap_net_admin+ep target/debug/scanner \
               cap_net_admin+ep target/debug/l2cap
      - run: cargo xtask e2e

  # The upstream NimBLE host unit test suite (esp-nimble's nimble/host/test,
  # ~208 cases) running against nimble-rs' porting layer (NPL locks/timers,
  # vendored os_mempool, msys pools, init sequence) - see tests/upstream
  # (workspace member, but never built in the same invocation as the other
  # members - see the root manifest). A failure means the porting layer
  # diverged from what the C host's own tests expect.
  upstream-host-tests:
    name: Upstream NimBLE host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run -p nimble-rs-upstream-tests

  # The published nimble-rs-sys package must stay well under the crates.io
  # 10 MB limit despite bundling the esp-nimble submodule; package.exclude
  # prunes it to ~600 KiB. A failure means the exclude list needs updating
  # (typically after a submodule bump).
  package-size:
    name: crates.io package size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Package nimble-rs-sys and check the size
        run: |
          cargo package -p nimble-rs-sys --no-verify --allow-dirty
          size=$(stat -c%s target/package/nimble-rs-sys-*.crate)
          echo "package size: $size bytes"
          test "$size" -lt 9000000
