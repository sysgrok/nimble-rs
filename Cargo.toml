[workspace]
members = ["nimble-rs-sys", "nimble-rs", "examples/app", "examples/std", "tests/upstream"]
# `tests/upstream` is a member (shared lockfile/target/IDE), but its
# test-only configuration (nimble-rs `external-ll`, nimble-rs-sys
# `upstream-test`) must never feature-unify with the other members, so it
# must not be built in the same cargo invocation: bare cargo commands skip it
# via `default-members`, and `--workspace` invocations pass
# `--exclude nimble-rs-upstream-tests`. (Violations fail loudly: undefined
# `ble_transport_ll_*` symbols and a duplicate embassy-time driver.)
default-members = ["nimble-rs-sys", "nimble-rs", "examples/app", "examples/std"]
# `xtask` is excluded as it is tooling, not a library; the embedded example
# crates are their own workspaces (own targets, lockfiles and patch sections).
exclude = ["xtask", "examples/nrf", "examples/esp", "examples/rp"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sysgrok/nimble-rs"

[workspace.dependencies]
nimble-rs-sys = { version = "0.1.0", path = "nimble-rs-sys", default-features = false }
nimble-rs = { version = "0.1.0", path = "nimble-rs" }

bt-hci = "0.9"
embassy-sync = "0.7"
embassy-futures = "0.1"
embassy-time = "0.5"
critical-section = "1"
heapless = "0.9"
embedded-io = "0.7"
embedded-io-async = "0.7"
enumset = { version = "1", default-features = false }

log = { version = "0.4", default-features = false }
defmt = "1"

# build deps
anyhow = "1"
bindgen = "0.72"
cc = "1.1"
env_logger = "0.11"

[profile.release]
debug = true
