# GATT server on Espressif chips: the esp-radio Bluetooth connector (a
# bt-hci transport), wrapped in the stock
# `bt_hci::controller::ExternalController`, plus an example esp-rtos-backed
# `Parker` (task-semaphore parking instead of busy-polling).
[package]
name = "nimble-rs-examples-esp"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
nimble-rs = { path = "../../nimble-rs", features = ["log", "log-level-info"] }
nimble-rs-examples-app = { path = "../app", features = ["log"] }

bt-hci = { version = "0.10", default-features = false }

esp-hal = { version = "~1.2", features = ["log-04", "unstable"] }
esp-radio = { version = "1.0.0-beta.0", features = ["ble", "log-04", "unstable"] }
esp-radio-rtos-driver = "0.4"
esp-rtos = { version = "0.4", features = ["embassy", "esp-alloc", "esp-radio", "log-04"] }
# Provides the Rust global allocator AND the C malloc family - i.e. the C
# heap for `nimble-rs`'s `use-c-heap`
esp-alloc = "0.11"
esp-backtrace = { version = "0.20", features = ["panic-handler", "println"] }
esp-println = { version = "0.18", features = ["log-04"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["log-04"] }

embassy-executor = "0.10"
embassy-time = "0.5"
log = "0.4"
static_cell = "2"

[features]
default = ["esp32c6"]
esp32c2 = ["esp-rtos/esp32c2", "esp-hal/esp32c2", "esp-backtrace/esp32c2", "esp-println/esp32c2", "esp-radio/esp32c2", "esp-bootloader-esp-idf/esp32c2"]
esp32c3 = ["esp-rtos/esp32c3", "esp-hal/esp32c3", "esp-backtrace/esp32c3", "esp-println/esp32c3", "esp-radio/esp32c3", "esp-bootloader-esp-idf/esp32c3"]
esp32c6 = ["esp-rtos/esp32c6", "esp-hal/esp32c6", "esp-backtrace/esp32c6", "esp-println/esp32c6", "esp-radio/esp32c6", "esp-bootloader-esp-idf/esp32c6"]
esp32h2 = ["esp-rtos/esp32h2", "esp-hal/esp32h2", "esp-backtrace/esp32h2", "esp-println/esp32h2", "esp-radio/esp32h2", "esp-bootloader-esp-idf/esp32h2"]

[profile.dev]
opt-level = "s"

[profile.release]
# "s", not "z": known LLVM miscompilation issues with "z" on RISC-V
opt-level = "s"
debug = 2
debug-assertions = false
lto = "fat"
codegen-units = 1
incremental = false
overflow-checks = false

# A recent esp-hal revision: the released esp-radio (1.0.0-beta.0) predates
# bt-hci 0.10, whereas git main speaks the `bt-hci-transport` trait bt-hci
# 0.10 is built on (esp-radio itself still lists bt-hci 0.9 for its legacy
# transport impl, which is why two bt-hci versions appear in the lockfile)
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-radio-rtos-driver = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
esp-metadata-generated = { git = "https://github.com/esp-rs/esp-hal", rev = "0fed45c84c0723ed4e0b7d19c7f3078ed79090c6" }
