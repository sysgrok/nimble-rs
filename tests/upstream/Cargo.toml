# The upstream NimBLE host *unit* test suite (esp-nimble/nimble/host/test),
# compiled against nimble-rs' porting layer. Run with
# `cargo run -p nimble-rs-upstream-tests`.
#
# A workspace member, but NOT a default-member and excluded from
# `--workspace` invocations (see the root manifest): its test-only host
# configuration (phony HCI acks, SELFTEST, `external-ll`) must never
# feature-unify with the other members, which happens whenever it is built
# in the same cargo invocation.
[package]
name = "nimble-rs-upstream-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# default features (std/alloc/roles/gatt/sm) plus the test-only extras
nimble-rs = { workspace = true, features = ["std", "l2cap", "external-ll", "log"] }
nimble-rs-sys = { workspace = true, features = ["upstream-test"] }
embassy-time = { workspace = true, features = ["mock-driver", "generic-queue-16"] }
env_logger = { workspace = true }
log = { workspace = true }

[build-dependencies]
cc = { workspace = true }
