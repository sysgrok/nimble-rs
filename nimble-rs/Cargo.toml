[package]
name = "nimble-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe, no_std, cross-platform Rust API for the esp-nimble BLE host, over any bt-hci controller"
documentation = "https://docs.rs/nimble-rs"
readme = "README.md"
categories = ["embedded", "api-bindings", "hardware-support"]
keywords = ["ble", "bluetooth", "nimble", "embedded", "async"]

[features]
# `no_std` by default (the primary audience is baremetal); `alloc` stays a
# default because the esp-nimble fork heap-allocates its mbuf/transport
# pools and GATT registry even in the `BLE_STATIC_TO_DYNAMIC=0` config -
# without a `nimble_platform_mem_*` backend the host cannot boot. (A static
# arena backend would lift that; until then, no-alloc builds are
# `--no-default-features`.)
default = ["alloc", "peripheral", "central", "sm"]

## Conveniences for hosted targets: the thread-park `Parker` (no spinning
## during HCI command-ack waits) and `std::error::Error` impls. Implies `alloc`.
std = ["alloc", "critical-section/std"]

## Boxed-closure callback subscription and the runtime GATT service table
## builder; also routes `nimble_platform_mem_*` to the global allocator.
alloc = []

## BLE roles (forwarded to `nimble-rs-sys`). The GATT roles ride on the GAP
## roles: `peripheral` brings the GATT *server* (Rust API + C), `central`
## the GATT *client*.
peripheral = ["broadcaster", "nimble-rs-sys/peripheral"]
central = ["observer", "nimble-rs-sys/central"]
broadcaster = ["nimble-rs-sys/broadcaster"]
observer = ["nimble-rs-sys/observer"]

## L2CAP connection-oriented channels; `l2cap` alone gives two channels,
## the `l2cap-coc-<N>` values raise the count (additive, largest wins).
l2cap = ["nimble-rs-sys/l2cap"]
l2cap-coc-1 = ["l2cap", "nimble-rs-sys/l2cap-coc-1"]
l2cap-coc-2 = ["l2cap", "nimble-rs-sys/l2cap-coc-2"]
l2cap-coc-4 = ["l2cap", "nimble-rs-sys/l2cap-coc-4"]
l2cap-coc-8 = ["l2cap", "nimble-rs-sys/l2cap-coc-8"]

## Maximum concurrent connections (additive, largest wins; reset value: 4)
max-connections-1 = ["nimble-rs-sys/max-connections-1"]
max-connections-2 = ["nimble-rs-sys/max-connections-2"]
max-connections-4 = ["nimble-rs-sys/max-connections-4"]
max-connections-8 = ["nimble-rs-sys/max-connections-8"]
max-connections-16 = ["nimble-rs-sys/max-connections-16"]
max-connections-32 = ["nimble-rs-sys/max-connections-32"]

## msys mbuf pool block count (additive, largest wins; reset value: 20)
msys-count-12 = ["nimble-rs-sys/msys-count-12"]
msys-count-20 = ["nimble-rs-sys/msys-count-20"]
msys-count-32 = ["nimble-rs-sys/msys-count-32"]
msys-count-64 = ["nimble-rs-sys/msys-count-64"]

## Extended (BLE 5) advertising; switches the GAP advertising API (mutually
## exclusive with the legacy advertising API, mirroring esp-idf-svc)
ext-adv = ["nimble-rs-sys/ext-adv"]

## Security Manager: `sm` enables legacy + LE Secure Connections pairing;
## `sm-sc-only` enables Secure-Connections-only mode (`sm` wins if both set)
sm = ["nimble-rs-sys/sm"]
sm-sc-only = ["nimble-rs-sys/sm-sc-only"]

## Infrastructure (forwarded to `nimble-rs-sys`)
prebuilt = ["nimble-rs-sys/prebuilt"]
force-generate-bindings = ["nimble-rs-sys/force-generate-bindings"]
use-gcc = ["nimble-rs-sys/use-gcc"]

## Leave the `ble_transport_ll_*` symbols undefined so an external (C) test
## harness can provide its own transport. Test harness use only.
external-ll = []

## Logging backends for the crate's own diagnostics
log = ["dep:log"]
defmt = ["dep:defmt"]

[dependencies]
nimble-rs-sys = { workspace = true }
bt-hci = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }
embassy-time = { workspace = true }
critical-section = { workspace = true }
heapless = { workspace = true }
embedded-io = { workspace = true }
embedded-io-async = { workspace = true }
enumset = { workspace = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

# The hermetic integration tests (tests/*.rs) drive the full host over an
# in-process mock controller - each file is its own binary, so each scenario
# gets a fresh process for the singleton host.
[dev-dependencies]
embassy-futures = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true, features = ["std", "generic-queue-16"] }
embedded-io = { workspace = true }
heapless = { workspace = true }
futures-lite = "2"
log = { version = "0.4", features = ["std"] }
env_logger = "0.11"

# The integration tests need `std` explicitly now that it is not a default
# (among else for the `critical-section/std` implementation).
[[test]]
name = "smoke"
required-features = ["std"]

[[test]]
name = "gatts_smoke"
required-features = ["std"]

[[test]]
name = "gattc_smoke"
required-features = ["std", "l2cap"]
